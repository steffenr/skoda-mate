<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Škoda Mate – Sign in</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<style>
/* Layout only: colours, type and controls come from style.css (the design system in DESIGN.md). */
body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
form { width: min(360px, 100%); }
form h1 { margin-bottom: var(--gap); }
.field { margin-top: 12px; }
button.btn { width: 100%; margin-top: 18px; }
.msg { min-height: 1.4em; margin-top: 10px; font-size: 13px; color: var(--bad); }
</style>
</head>
<body>
<form id="f" class="card">
<h1>Škoda Mate</h1>
<label class="field" for="e"><span>E-mail</span><input id="e" type="email" autocomplete="username" required autofocus></label>
<label class="field" for="p"><span>Password</span><input id="p" type="password" autocomplete="current-password" required></label>
<button class="btn primary">Sign in</button>
<div class="msg" id="m" role="alert"></div>
</form>
<script src="/static/login.js"></script>
</body></html>
