<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Škoda Mate – Sign in</title>
<style>
:root{--bg:#f7f9f8;--fg:#1b1b1b;--card:#fff;--mut:#5c6660;--acc:#0e3a2f;--on-acc:#fff;--bad:#b0301f;--bd:#d9dedb}
@media(prefers-color-scheme:dark){:root{--bg:#121613;--fg:#e8ebe9;--card:#181e1a;--mut:#9aa5a0;--acc:#78faae;--on-acc:#0e3a2f;--bad:#ff8a80;--bd:#2c332f}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;width:min(340px,calc(100vw - 32px))}
h1{font-size:20px;margin:0 0 16px}label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{margin-top:18px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:var(--on-acc);font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--bad);min-height:1.4em;margin-top:10px;font-size:13px}
</style></head><body>
<form id="f"><h1>Škoda Mate</h1>
<label for="e">E-mail</label><input id="e" type="email" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<button>Sign in</button><div class="err" id="m" role="alert"></div></form>
<script src="/static/login.js"></script></body></html>
