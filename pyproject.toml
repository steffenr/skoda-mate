[project]
name = "skoda-mate"
version = "0.1.3"
description = "Trip tracking, charge logging and remote control for Škoda vehicles (official MyŠkoda Public API)"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Steffen Rühlmann" }]
requires-python = ">=3.15"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "paho-mqtt>=2.0", "cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.15", "mypy>=2", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Lint and type gates. `uv run --extra dev ruff check` and `uv run --extra dev mypy` are what CI runs.
[tool.ruff]
line-length = 120
target-version = "py315"
extend-exclude = ["scripts/dom-smoke/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = [
  "E501",  # long single-line docstrings and API descriptions are deliberate; review handles readability
]

[tool.mypy]
python_version = "3.15"
files = ["skoda_mate"]
# The data layer passes `sqlite3`-shaped objects around without protocols, so a fully typed codebase is not the goal.
# What is enforced: anything that is typed is checked, and untyped bodies are checked too (a typo or a None is caught).
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["skoda_mate"]

[tool.setuptools.package-data]
skoda_mate = ["index.html", "login.html", "setup.html", "static/*", "static/lib/*", "static/pages/*"]

[tool.coverage.run]
source = ["skoda_mate"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint.per-file-ignores]
# Tests and the dev broker keep `setup(); action()` on one line for compact, comment-aligned fixtures.
"tests/*" = ["E702"]
"scripts/minibroker.py" = ["E702"]
